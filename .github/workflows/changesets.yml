name: Changesets

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: changesets-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:versions
      - run: pnpm test:release
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - name: Create or update version PR
        id: changesets
        uses: changesets/action@v1
        with:
          github-token: ${{ secrets.RELEASE_TOKEN || github.token }}
          version: pnpm version-packages
          title: 'chore: release ddns-rust'
          commit: 'chore: version ddns-rust'
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
      # Reset any checkout state left by the action. Use GITHUB_TOKEN for tags
      # so tags are always written by the standard workflow token.
      - uses: actions/checkout@v4
        if: steps.changesets.outputs.hasChangesets == 'false'
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Tag the merged version
        id: tag
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: node scripts/prepare-release.mjs

  build:
    needs: version
    if: needs.version.outputs.tag != ''
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-x86_64
            include_systemd: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-arm64
            include_systemd: true
          - target: aarch64-apple-darwin
            os: macos-latest
            name: macos-arm64
            include_systemd: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: windows-x86_64
            include_systemd: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Prepare package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/ddns-rust
          cp target/${{ matrix.target }}/release/ddns-rust dist/ddns-rust/
          cp config.example.toml dist/ddns-rust/
          cp README.md dist/ddns-rust/
          cp CHANGELOG.md dist/ddns-rust/
          if [ "${{ matrix.include_systemd }}" = "true" ]; then
            cp -r deploy dist/ddns-rust/
          fi
          cd dist
          tar -czvf ddns-rust-${{ matrix.name }}.tar.gz ddns-rust

      - name: Prepare package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/ddns-rust
          Copy-Item target/${{ matrix.target }}/release/ddns-rust.exe dist/ddns-rust/
          Copy-Item config.example.toml dist/ddns-rust/
          Copy-Item README.md dist/ddns-rust/
          Copy-Item CHANGELOG.md dist/ddns-rust/
          cd dist
          tar -czvf ddns-rust-${{ matrix.name }}.tar.gz ddns-rust

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ddns-rust-${{ matrix.name }}
          path: dist/ddns-rust-${{ matrix.name }}.tar.gz

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract Changesets release notes
        run: node scripts/release-notes.mjs > release-notes.md
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          files: artifacts/**/*.tar.gz
          body_path: release-notes.md
          fail_on_unmatched_files: true

  docker:
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.version.outputs.tag }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
